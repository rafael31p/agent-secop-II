# Almacén de infracciones congeladas de ReglaDeDependenciasTest.
#
# Se versiona junto al código a propósito: es el registro de la deuda
# arquitectónica aceptada, y verlo encoger commit a commit durante la fase 2 del
# plan es la señal de que el trabajo avanza.
freeze.store.default.path=src/test/resources/archunit_store

# Permitir crear el almacén solo cuando no existe. Una vez creado, una
# infracción nueva falla en lugar de añadirse en silencio: si esto fuera
# permanentemente true, la regla no impediría nada.
freeze.store.default.allowStoreCreation=true

# Al arreglar una infracción, se borra del almacén. Sin esto, la deuda saldada
# seguiría contando y la regla nunca llegaría a cero.
freeze.store.default.allowStoreUpdate=true
