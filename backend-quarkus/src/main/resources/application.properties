# ============================================================================
# Agente SECOP II — backend Quarkus
# Los secretos NO van aquí: se leen de variables de entorno o de .env (ignorado
# por git). Cada propiedad tiene su equivalente en mayúsculas con guion bajo,
# p. ej. agente.ia.gemini.api-key -> AGENTE_IA_GEMINI_API_KEY
# ============================================================================

quarkus.application.name=agente-secop
quarkus.http.port=8000

# --- CORS ---
# Sin orígenes en la base, a propósito. Un valor por defecto permisivo es cómo se
# despliega un agujero sin querer: basta con olvidar la variable de entorno.
#
# Conviene recordar que CORS no es un control de acceso: lo aplica el navegador y
# `curl` lo ignora. Quien protege los endpoints que gastan dinero es la clave de
# API; esto solo evita que una página ajena use el navegador de un usuario.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Api-Key
quarkus.http.cors.access-control-max-age=24H

%dev.quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
%test.quarkus.http.cors.origins=http://localhost:3000
# Sin AGENTE_CORS_ORIGINS, el arranque en producción falla. Es el comportamiento
# buscado: mejor no arrancar que arrancar sin saber quién puede llamar.
%prod.quarkus.http.cors.origins=${AGENTE_CORS_ORIGINS}

# --- Cabeceras de seguridad ---
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Frame-Options".value=DENY

# ============================================================================
# Autenticación y límites de consumo
# Protege los endpoints que gastan dinero. /api/salud y /api/proveedores quedan
# abiertos: el frontend los consulta antes de tener contexto y no cuestan nada.
# ============================================================================
# Claves admitidas, como nombre -> sha256:<hash>. Se guardan hashes, no claves:
# quien lea esta configuración no obtiene con qué llamar. Para generar una:
#     openssl rand -hex 32 | tee /dev/stderr | tr -d '\n' | sha256sum
# agente.seguridad.api-keys.equipo=sha256:...

# En desarrollo y en pruebas estorba más de lo que aporta. En cualquier otro
# perfil es obligatoria, y el arranque falla si no hay ninguna clave.
agente.seguridad.autenticacion-requerida=true
%dev.agente.seguridad.autenticacion-requerida=false
%test.agente.seguridad.autenticacion-requerida=false

# Peticiones por clave y hora. Holgados a propósito: acotan el abuso, no el uso.
agente.seguridad.limites.analisis=20
agente.seguridad.limites.propuesta=20
agente.seguridad.limites.validacion=15
agente.seguridad.limites.relevancia=40
agente.seguridad.limites.chat=100
agente.seguridad.limites.busqueda=300
agente.seguridad.limites.documento=60

# --- Subida de pliegos ---
quarkus.http.limits.max-body-size=30M
quarkus.http.body.handle-file-uploads=true

# --- Documentación ---
quarkus.smallrye-openapi.info-title=Agente SECOP II
quarkus.smallrye-openapi.info-version=0.2.0
quarkus.smallrye-openapi.info-description=Agente experto en contratación pública \
  colombiana. Explora procesos de SECOP II, analiza requisitos técnicos de tecnología, \
  genera propuestas y valida su cumplimiento. Herramienta de apoyo analítico: no \
  sustituye asesoría jurídica ni el estudio de los documentos oficiales del proceso.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

# ============================================================================
# SECOP II (datos.gov.co / Socrata)
# ============================================================================
quarkus.rest-client.secop.url=https://www.datos.gov.co
quarkus.rest-client.secop.connect-timeout=10000
quarkus.rest-client.secop.read-timeout=45000

agente.secop.dataset-procesos=p6dx-8zbt
agente.secop.dataset-contratos=jbjy-vk9h
# Token opcional de datos.gov.co: sube el límite de peticiones.
agente.secop.app-token=

# ============================================================================
# Proveedores de IA
# El proveedor y el modelo se pueden sobrescribir por petición; esto es solo
# el valor por defecto cuando la petición no los especifica.
# ============================================================================
agente.ia.proveedor-por-defecto=gemini
agente.ia.max-tokens=32000
agente.ia.temperatura=0.2
agente.ia.timeout-segundos=300
agente.ia.intentos-maximos=3
agente.ia.espera-base-millis=2000
agente.ia.registrar-peticiones=false

# --- Google Gemini: https://aistudio.google.com/apikey ---
agente.ia.gemini.api-key=
agente.ia.gemini.modelo-por-defecto=gemini-3.6-flash

# --- OpenAI: https://platform.openai.com/api-keys ---
agente.ia.openai.api-key=
agente.ia.openai.modelo-por-defecto=gpt-4.1-mini

# --- Anthropic: https://console.anthropic.com ---
agente.ia.anthropic.api-key=
agente.ia.anthropic.modelo-por-defecto=claude-sonnet-4-6

# --- DeepSeek (API compatible con OpenAI): https://platform.deepseek.com ---
agente.ia.deepseek.api-key=
agente.ia.deepseek.modelo-por-defecto=deepseek-chat
agente.ia.deepseek.base-url=https://api.deepseek.com/v1

# --- Ollama (local): requiere el servidor levantado ---
agente.ia.ollama.habilitado=false
agente.ia.ollama.base-url=http://localhost:11434
agente.ia.ollama.modelo-por-defecto=llama3.1

# ============================================================================
# Perfil de pruebas: sin credenciales reales ni llamadas salientes.
# ============================================================================
%test.quarkus.rest-client.secop.url=http://localhost:8089
%test.agente.ia.gemini.api-key=
%test.agente.ia.openai.api-key=
%test.agente.ia.anthropic.api-key=
%test.agente.ia.deepseek.api-key=
%test.agente.ia.ollama.habilitado=false
%test.agente.ia.intentos-maximos=1
%test.quarkus.log.level=WARN
