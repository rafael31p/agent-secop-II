# ============================================================================
# Agente SECOP II — backend Quarkus
# Los secretos NO van aquí: se leen de variables de entorno o de .env (ignorado
# por git). Cada propiedad tiene su equivalente en mayúsculas con guion bajo,
# p. ej. agente.ia.gemini.api-key -> AGENTE_IA_GEMINI_API_KEY
# ============================================================================

quarkus.application.name=agente-secop
quarkus.http.port=8000

# --- CORS ---
# Sin orígenes en la base, a propósito. Un valor por defecto permisivo es cómo se
# despliega un agujero sin querer: basta con olvidar la variable de entorno.
#
# Conviene recordar que CORS no es un control de acceso: lo aplica el navegador y
# `curl` lo ignora. Quien protege los endpoints que gastan dinero es la clave de
# API; esto solo evita que una página ajena use el navegador de un usuario.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Api-Key,X-Correlation-Id
# Sin exponerla, el navegador no deja al frontend leer la cabecera: el usuario no
# podría copiar el identificador que necesita para reportar un fallo.
quarkus.http.cors.exposed-headers=X-Correlation-Id
quarkus.http.cors.access-control-max-age=24H

%dev.quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
%test.quarkus.http.cors.origins=http://localhost:3000
# Sin AGENTE_CORS_ORIGINS, el arranque en producción falla. Es el comportamiento
# buscado: mejor no arrancar que arrancar sin saber quién puede llamar.
%prod.quarkus.http.cors.origins=${AGENTE_CORS_ORIGINS}

# --- Cabeceras de seguridad ---
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Frame-Options".value=DENY

# ============================================================================
# Autenticación y límites de consumo
# Protege los endpoints que gastan dinero. /api/salud y /api/proveedores quedan
# abiertos: el frontend los consulta antes de tener contexto y no cuestan nada.
# ============================================================================
# Claves admitidas, como nombre -> sha256:<hash>. Se guardan hashes, no claves:
# quien lea esta configuración no obtiene con qué llamar. Para generar una:
#     openssl rand -hex 32 | tee /dev/stderr | tr -d '\n' | sha256sum
# agente.seguridad.api-keys.equipo=sha256:...

# En desarrollo y en pruebas estorba más de lo que aporta. En cualquier otro
# perfil es obligatoria, y el arranque falla si no hay ninguna clave.
agente.seguridad.autenticacion-requerida=true
%dev.agente.seguridad.autenticacion-requerida=false
%test.agente.seguridad.autenticacion-requerida=false

# Peticiones por clave y hora. Holgados a propósito: acotan el abuso, no el uso.
agente.seguridad.limites.analisis=20
agente.seguridad.limites.propuesta=20
agente.seguridad.limites.validacion=15
agente.seguridad.limites.relevancia=40
agente.seguridad.limites.chat=100
agente.seguridad.limites.busqueda=300
agente.seguridad.limites.documento=60

# --- Subida de pliegos ---
quarkus.http.limits.max-body-size=30M
quarkus.http.body.handle-file-uploads=true

# --- Límites del servidor: la última línea de defensa ---
# Por encima del presupuesto del caso de uso más caro (240 s) a propósito: quien
# debe cortar es Fault Tolerance, que sabe reintentar, contar la métrica y dar un
# mensaje accionable. Si corta el servidor, el cliente solo ve una conexión rota.
quarkus.http.read-timeout=300s
quarkus.http.idle-timeout=310s

# --- Presupuesto de hilos, declarado ---
# Con los mamparos actuales —12 modelo + 8 chat + 30 SECOP + 4 extracción = 54 en el
# peor caso— sobra de largo, y ese margen es deliberado: deja sitio a las peticiones
# baratas (salud, proveedores, búsqueda) cuando las caras están al tope. Fijarlo
# convierte un supuesto en un contrato y hace que un desbordamiento se manifieste
# antes y más claro, en vez de degradarse sin que nada lo diga.
quarkus.thread-pool.max-threads=120
quarkus.thread-pool.queue-size=200

# --- Documentación ---
quarkus.smallrye-openapi.info-title=Agente SECOP II
# Una sola verdad: la versión sale del pom.xml. Antes había tres números
# distintos —pom, esta propiedad y una constante en SaludResource— y ya
# divergían: el pom decía 0.1.0 y la API anunciaba 0.2.0.
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Agente experto en contratación pública \
  colombiana. Explora procesos de SECOP II, analiza requisitos técnicos de tecnología, \
  genera propuestas y valida su cumplimiento. Herramienta de apoyo analítico: no \
  sustituye asesoría jurídica ni el estudio de los documentos oficiales del proceso.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

# ============================================================================
# SECOP II (datos.gov.co / Socrata)
# ============================================================================
quarkus.rest-client.secop.url=https://www.datos.gov.co
quarkus.rest-client.secop.connect-timeout=10000
quarkus.rest-client.secop.read-timeout=45000

agente.secop.dataset-procesos=p6dx-8zbt
agente.secop.dataset-contratos=jbjy-vk9h
# Token opcional de datos.gov.co: sube el límite de peticiones.
agente.secop.app-token=

# ============================================================================
# Proveedores de IA
# El proveedor y el modelo se pueden sobrescribir por petición; esto es solo
# el valor por defecto cuando la petición no los especifica.
# ============================================================================
agente.ia.proveedor-por-defecto=gemini
agente.ia.max-tokens=32000
agente.ia.temperatura=0.2
# MENOR que el @Timeout por intento de la política (120 s), y no al revés. Si el
# cliente HTTP espera más que la política, a los 120 s Fault Tolerance devuelve
# TimeoutException mientras el hilo sigue atrapado en una lectura de socket que no
# responde a interrupt(): o el mamparo gobierna una concurrencia que ya no es la
# real, o se llena de llamadas fantasma durante tres minutos con el proveedor
# perfectamente sano. Los timeouts van monótonos hacia adentro (SPEC-BE-08 §3.2):
#   cliente HTTP 100 s < intento 120 s < caso de uso 150-240 s < servidor 300 s
# `TimeoutsMonotonosTest` falla si alguien rompe la cadena.
agente.ia.timeout-segundos=100
agente.ia.registrar-peticiones=false

# Cuánto se espera antes de cerrar un cliente expulsado de la caché. Por encima
# del @Timeout por intento (120 s) con margen: expulsar no es dejar de usar, y la
# referencia que la caché ya entregó puede estar en mitad de una llamada. Cerrarla
# ahí la aborta, el fallo se traduce como transitorio, se reintenta y nadie ve la
# carrera —solo latencia y coste duplicados—. Ver SPEC-BE-08 §3.1.
agente.ia.gracia-de-cierre=PT3M
# Cota de conversaciones simultáneas. Es concurrencia, no caudal: el límite por
# clave y hora no impide abrir las cien a la vez.
agente.ia.maximo-conversaciones-simultaneas=8
# En pruebas no hay nada que proteger y esperar tres minutos alargaría la suite.
%test.agente.ia.gracia-de-cierre=PT1S

# --- Google Gemini: https://aistudio.google.com/apikey ---
agente.ia.gemini.api-key=
agente.ia.gemini.modelo-por-defecto=gemini-3.6-flash

# --- OpenAI: https://platform.openai.com/api-keys ---
agente.ia.openai.api-key=
agente.ia.openai.modelo-por-defecto=gpt-4.1-mini

# --- Anthropic: https://console.anthropic.com ---
agente.ia.anthropic.api-key=
agente.ia.anthropic.modelo-por-defecto=claude-sonnet-4-6

# --- DeepSeek (API compatible con OpenAI): https://platform.deepseek.com ---
agente.ia.deepseek.api-key=
agente.ia.deepseek.modelo-por-defecto=deepseek-chat
agente.ia.deepseek.base-url=https://api.deepseek.com/v1

# --- Ollama (local): requiere el servidor levantado ---
agente.ia.ollama.habilitado=false
agente.ia.ollama.base-url=http://localhost:11434
agente.ia.ollama.modelo-por-defecto=llama3.1

# ============================================================================
# Resiliencia (SPEC-BE-02)
#
# La política se declara con anotaciones en PoliticaDeResiliencia y en
# ConsultaResiliente; estas líneas son las que la vuelven ajustable sin
# recompilar ni desplegar. El formato de MicroProfile es
#     <clase completa>/<método>/<Anotación>/<parámetro>
# Los valores repiten los de las anotaciones: están aquí para que se vean, se
# documenten juntos y se puedan cambiar en caliente por variable de entorno.
#
# TODO SE EXPRESA EN MILISEGUNDOS, y no es una preferencia de estilo. Sobrescribir
# por configuración cambia el número pero NO la unidad declarada en la anotación:
# con `delayUnit = SECONDS`, un `Retry/delay=2000` pide dos mil segundos. Se
# descubrió porque el arranque falló con «maxDuration should be greater than
# delay», que es una suerte —el mismo error en `Timeout/value` habría arrancado
# tan campante con un timeout de treinta y tres horas—. Por eso todas las
# anotaciones declaran MILLIS: la unidad del código y la de aquí coinciden.
# ============================================================================

# --- Llamadas al modelo de lenguaje ---
# 120 s y no los 300 s de antes: por encima de dos minutos esperando una pantalla,
# el patrón correcto es un trabajo asíncrono, no una espera más larga.
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Timeout/value=120000
# Tres intentos en total, igual que el bucle artesanal que esto sustituye. Con
# cortacircuitos no hacen falta más: insistir con el proveedor caído solo alarga
# la espera del usuario.
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Retry/maxRetries=2
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Retry/delay=2000
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Retry/jitter=1000
# CALIBRADO CON MEDICIÓN, y la primera versión (8 / 0,5) estaba mal. El circuito se
# abrió contra Gemini real mientras TODAS las llamadas funcionaban: ninguna agotó sus
# reintentos y aun así contó 6 fallos de 13. El motivo es el orden que fija
# MicroProfile —Retry envuelve a CircuitBreaker—, así que el circuito cuenta INTENTOS,
# no llamadas, y un proveedor que falla el 40 % de los intentos pero responde al
# reintentar rozaba el umbral de continuo. Retirar treinta segundos un servicio que
# funciona es peor que no tener circuito.
# Con 0,8 sobre 20 hacen falta 16 fallos de 20 intentos: con una tasa base del 50 % eso
# pasa por azar menos del 1 % de las veces. Vuelve a significar «el proveedor cayó».
# 30 s de reposo porque las cuotas de los planes gratuitos se reponen por minuto.
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/CircuitBreaker/requestVolumeThreshold=20
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/CircuitBreaker/failureRatio=0.8
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/CircuitBreaker/delay=30000
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/CircuitBreaker/successThreshold=2
# El mamparo. Conservador a propósito: se sube con las métricas de llm.peticion en
# la mano, no por intuición. Es lo que impide que la IA ahogue a la búsqueda.
co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Bulkhead/value=12

# --- Consultas a datos.gov.co ---
# Más agresiva: la fuente es gratuita y rápida, así que reintentar cuesta medio
# segundo y no cuesta dinero.
co.agentesecop.secop.ConsultaResiliente/consultar/Timeout/value=20000
co.agentesecop.secop.ConsultaResiliente/consultar/Retry/maxRetries=2
co.agentesecop.secop.ConsultaResiliente/consultar/Retry/delay=500
co.agentesecop.secop.ConsultaResiliente/consultar/CircuitBreaker/requestVolumeThreshold=10
co.agentesecop.secop.ConsultaResiliente/consultar/CircuitBreaker/failureRatio=0.6
co.agentesecop.secop.ConsultaResiliente/consultar/CircuitBreaker/delay=15000
# Mamparo propio y más ancho. Que sean dos y no uno es el punto entero: un
# incidente de Gemini no puede dejar sin búsqueda a quien solo quería listar.
co.agentesecop.secop.ConsultaResiliente/consultar/Bulkhead/value=30

# --- Presupuesto de tiempo por caso de uso ---
# Acota la petición HTTP completa, no cada llamada. Importa sobre todo en la
# validación, que puede encadenar dos invocaciones al modelo.
co.agentesecop.application.service.ServicioDeValidacion/validar/Timeout/value=240000
co.agentesecop.application.service.ServicioDeAnalisis/analizar/Timeout/value=150000
co.agentesecop.application.service.ServicioDePropuestas/generar/Timeout/value=180000
co.agentesecop.application.service.ServicioDePriorizacion/priorizar/Timeout/value=120000

# ============================================================================
# Observabilidad (SPEC-BE-05)
# ============================================================================
# /q/health/live y /q/health/ready. El /api/salud de siempre se conserva para el
# pie del frontend, pero quien decide operaciones son estas.
quarkus.smallrye-health.root-path=/q/health

# Micrometer publica además las métricas de Fault Tolerance: reintentos gastados,
# estado del cortacircuitos y ocupación del mamparo. Son el instrumento con el que
# se calibran los valores de arriba; sin ellas serían adivinanzas.
quarkus.micrometer.export.prometheus.enabled=true
# AVISO DE DESPLIEGUE: /q/metrics expone información operativa (qué modelos se
# usan, cuánto falla cada proveedor, cuánto se consume). No debe publicarse junto
# a la API: se restringe por red o por proxy inverso.
quarkus.micrometer.export.prometheus.path=/q/metrics

# El identificador de correlación en cada línea de registro. Sin esto, el
# identificador que ve el usuario en el error no sirve para encontrar nada.
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [%X{correlationId}] %s%e%n

# ============================================================================
# Perfil de pruebas: sin credenciales reales ni llamadas salientes.
#
# Estas líneas NO bastan por sí solas: Quarkus lee el archivo .env con más
# prioridad que application.properties, así que en la máquina de quien tiene
# claves configuradas ganaban ellas. El blindaje de verdad lo hace
# `pruebas.AislamientoDePruebas`, una fuente de configuración de prioridad
# superior que solo existe en el classpath de pruebas, y lo vigila
# `AislamientoDePruebasTest`.
# ============================================================================
%test.quarkus.rest-client.secop.url=http://localhost:8089
%test.agente.ia.gemini.api-key=
%test.agente.ia.openai.api-key=
%test.agente.ia.anthropic.api-key=
%test.agente.ia.deepseek.api-key=
%test.agente.ia.ollama.habilitado=false
%test.quarkus.log.level=WARN
# Un solo intento por defecto: las pruebas que no van sobre resiliencia no deben
# pagar reintentos ni esperas. Las que sí, lo suben en su propio perfil.
%test.co.agentesecop.adapter.out.llm.PoliticaDeResiliencia/estructurado/Retry/maxRetries=0
%test.co.agentesecop.secop.ConsultaResiliente/consultar/Retry/maxRetries=0
