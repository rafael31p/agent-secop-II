name: CI

# Se ejecuta en cada empuje y en cada solicitud de cambios. El objetivo de esta
# canalización es sencillo: que romper una suite sea imposible de ignorar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un empuje nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos verificando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Quarkus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-quarkus
    steps:
      - uses: actions/checkout@v5

      - name: Preparar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verificar
        # Sin credenciales de ningún proveedor, a propósito: el perfil de
        # pruebas debe ser autosuficiente. Si alguna prueba empieza a necesitar
        # una clave real, aquí se nota.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar informes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend-quarkus/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Instalar dependencias
        # `npm ci` y no `npm install`: respeta el lockfile y falla si se
        # desincroniza, que es justo lo que se quiere detectar en CI.
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Lint
        # ESLint arranca con casi todas las reglas en aviso (ver
        # eslint.config.mjs). `--max-warnings` queda sin fijar a propósito: los
        # avisos se ven en el registro pero todavía no bloquean.
        run: npx eslint .

      - name: Formato
        run: npx prettier --check .

      - name: Pruebas
        run: npx vitest run

      - name: Compilar
        run: npm run build

  secretos:
    name: Análisis de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks necesita el historial completo: una credencial retirada en
          # el último commit sigue estando en los anteriores.
          fetch-depth: 0

      # Se invoca el binario en lugar de la acción oficial. La acción calcula el
      # rango a analizar como `<primero>^..<último>`, y en el primer empuje de un
      # repositorio el commit inicial no tiene padre: el rango es inválido y el
      # análisis falla sin haber mirado nada. `detect --source .` recorre el
      # historial completo, que además es lo que se quiere: una credencial
      # retirada en el último commit sigue estando en los anteriores.
      - name: gitleaks
        env:
          VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1
